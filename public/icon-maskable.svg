<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <!-- Shield Accent Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base (covers entire area) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  
  <!-- Scaled content to fit perfectly within maskable 60% safe zone -->
  <g transform="translate(102.4, 102.4) scale(0.6)">
    <!-- Ambient Glow in Center -->
    <circle cx="256" cy="256" r="140" fill="#4f46e5" opacity="0.15" filter="url(#glow)" />
    <circle cx="256" cy="256" r="80" fill="#10b981" opacity="0.1" filter="url(#glow)" />

    <!-- Outer Ring (Shield Outline) -->
    <path d="M 256,76 C 354,76 396,112 396,112 C 396,112 396,280 256,436 C 116,280 116,112 116,112 C 116,112 158,76 256,76 Z" 
          fill="url(#shieldGrad)" 
          stroke="#4f46e5" 
          stroke-width="4"
          filter="drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.5))" />

    <!-- Inner Shield for contrast -->
    <path d="M 256,96 C 334,96 368,124 368,124 C 368,124 368,260 256,396 C 144,260 144,124 144,124 C 144,124 178,96 256,96 Z" 
          fill="#020617" 
          opacity="0.85" />

    <!-- Emerald Lock in the center -->
    <g transform="translate(196, 176)" filter="drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.4))">
      <!-- Lock Shackle -->
      <path d="M 24,50 V 32 C 24,14 38,0 60,0 C 82,0 96,14 96,32 V 50" 
            fill="none" 
            stroke="url(#emeraldGrad)" 
            stroke-width="14" 
            stroke-linecap="round" />
      
      <!-- Lock Body -->
      <rect x="0" y="44" width="120" height="96" rx="20" fill="url(#emeraldGrad)" />
      
      <!-- Keyhole -->
      <circle cx="60" cy="84" r="10" fill="#020617" />
      <polygon points="55,84 65,84 68,112 52,112" fill="#020617" />
    </g>
  </g>
</svg>
